# Publishes a GitHub release with the installable zip, for the version in
# Pathwise_Vanilla.toc. Runs by itself on every push to main: a version
# that has no release yet gets one; otherwise nothing happens. Can also be
# started from the Actions tab (Release > Run workflow - replaces the zip of
# an existing release) or by pushing a version tag (v0.2.0, ...).
# A new release is also uploaded to CurseForge (tools/curseforge_upload.sh)
# when the repository has the CURSEFORGE_API_TOKEN secret and the
# CURSEFORGE_PROJECT_ID variable; Run workflow with "Upload this version to
# CurseForge" ticked uploads the current version again.
name: Release

on:
  workflow_dispatch:
    inputs:
      curseforge:
        description: Upload this version to CurseForge
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

# One release run at a time; a newer push waits for the one before it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the version
        run: |
          VERSION=$(sed -n 's/^## Version: *//p' Pathwise_Vanilla.toc | tr -d '\r')
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME, TOC version $VERSION"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Skip versions that are already released
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already released; nothing to do."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Run the offline tests
        if: env.SKIP != '1'
        run: |
          sudo apt-get install -y -qq lua5.1
          lua5.1 tests/run.lua

      - name: Build the zip
        if: env.SKIP != '1'
        run: tools/build_zip.sh "Pathwise-$VERSION.zip"

      - name: Publish the release
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes: the tag message, else the release notes in CHANGELOG.md.
          NOTES=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            NOTES=$(git for-each-ref "refs/tags/$TAG" --format='%(contents)')
          fi
          if [ -z "$NOTES" ] && [ -f CHANGELOG.md ]; then
            NOTES=$(awk -v v="## $VERSION" '$0 == v {on = 1; next} /^## / {on = 0} on' CHANGELOG.md)
          fi
          # (CurseForge gets the notes alone: it installs the zip itself.)
          printf '%s\n' "${NOTES:-Pathwise $VERSION}" > changelog.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Same version released again (Run workflow, tag): replace the zip.
            gh release upload "$TAG" "Pathwise-$VERSION.zip" --clobber
            exit 0
          fi
          echo "CREATED=1" >> "$GITHUB_ENV"
          printf '%s\n\nDownload **Pathwise-%s.zip** below (not "Source code"), unzip it into World of Warcraft/_classic_era_/Interface/AddOns, and check that the folder is named Pathwise.\n' \
            "$NOTES" "$VERSION" > notes.md
          gh release create "$TAG" "Pathwise-$VERSION.zip" --target "$GITHUB_SHA" --title "Pathwise $VERSION" --notes-file notes.md

      # (A new release, or Run workflow with "Upload to CurseForge" ticked.)
      - name: Upload to CurseForge
        if: env.SKIP != '1' && (env.CREATED == '1' || inputs.curseforge)
        env:
          CF_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CF_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        run: tools/curseforge_upload.sh "Pathwise-$VERSION.zip" "$VERSION" Pathwise_Vanilla.toc changelog.md
